[package]
name = "quantus-wormhole-native"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Node.js addon exposing the Quantus wormhole core"

[lib]
crate-type = ["cdylib"]

[dependencies]
quantus-wormhole-core = { path = "../core", features = ["public-batch"] }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
