name: Native addon

# Builds @quantus-network/wormhole for every supported platform. On a published
# GitHub Release it also publishes the platform packages and the package itself
# to npm via Trusted Publishing (each package name must be registered for OIDC
# on npmjs.com first).
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            setup: sudo apt-get update && sudo apt-get install -y musl-tools
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wormhole -> target
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.setup
        run: ${{ matrix.setup }}
      - name: Build
        run: cd wormhole/native && npx napi build --platform --release --target ${{ matrix.target }} --js binding.js --dts binding.d.ts && npm run build:ts
      - name: Smoke test the package
        if: "!contains(matrix.target, 'musl')"
        run: node --test test/wormhole.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: wormhole/native/*.node
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest && npm ci
      - uses: actions/download-artifact@v4
        with:
          path: wormhole/native/artifacts
      - name: Place binaries and set versions from the release tag
        run: |
          cd wormhole/native
          npx napi artifacts
          npx napi prepublish --no-gh-release -t npm
      - name: Publish platform packages and the package
        run: |
          cd wormhole/native
          npm run build:ts
          for dir in npm/*/; do (cd "$dir" && npm publish --provenance --access public); done
          npm publish --provenance --access public
